services:
  kanban:
    build:
      context: .
      dockerfile: Dockerfile
    image: modrev-kanban:local
    # Publish only to the host loopback so the board is not exposed to your LAN.
    # Change to "3484:3484" to expose it on all host interfaces.
    ports:
      - "127.0.0.1:${KANBAN_PORT:-3484}:3484"
    environment:
      # Bind inside the container so the published port is reachable.
      KANBAN_RUNTIME_HOST: "0.0.0.0"
      KANBAN_RUNTIME_PORT: "3484"
      # Containers should not self-update.
      KANBAN_NO_AUTO_UPDATE: "1"
      # Set to 1 to skip the remote-access passcode (see docker-entrypoint.sh).
      KANBAN_NO_PASSCODE: "${KANBAN_NO_PASSCODE:-}"
    volumes:
      # The git repo you want Kanban to manage. Override with:
      #   KANBAN_PROJECT=/abs/path/to/repo docker compose up
      - "${KANBAN_PROJECT:-./}:/workspace"
      # Persist Kanban state (indexed projects, task worktrees, config).
      - "kanban-state:/root/.cline"
    stop_grace_period: 30s

volumes:
  kanban-state:
