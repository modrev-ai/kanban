name: Create release tag

# Temporary helper: creates a git tag at a given commit using the repository's
# built-in Actions token. Used to create release tags when an external
# credential cannot push tags directly.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to create (example: v1.2.3)"
        required: true
        type: string
      sha:
        description: "Commit SHA the tag should point to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create tag ref
        uses: actions/github-script@v7
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        with:
          script: |
            const tag = process.env.TAG;
            const sha = process.env.SHA;
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha,
            });
            core.info(`Created refs/tags/${tag} -> ${sha}`);
