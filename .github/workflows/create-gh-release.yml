name: Create GitHub release

# Temporary helper: creates a GitHub Release for an existing tag using the
# repository's built-in Actions token, for releases published out-of-band.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to create a release for"
        required: true
        type: string
      body:
        description: "Release body"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        uses: actions/github-script@v7
        env:
          TAG: ${{ inputs.tag }}
          BODY: ${{ inputs.body }}
        with:
          script: |
            const tag = process.env.TAG;
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              body: process.env.BODY,
              prerelease: tag.includes("-"),
            });
            core.info(`Created release for ${tag}`);
