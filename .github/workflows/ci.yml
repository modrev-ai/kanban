name: CI

# Manual only (25 Nov 2026, Jong: GitHub is code storage first; Actions only for public-site deploys
# and jobs that must run on GitHub).
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
