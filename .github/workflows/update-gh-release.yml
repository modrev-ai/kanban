name: Update GitHub release

# Temporary helper: rewrites an existing release's body and prerelease flag
# using the repository's built-in Actions token.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag whose release to update"
        required: true
        type: string
      body:
        description: "New release body"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Update release
        uses: actions/github-script@v7
        env:
          TAG: ${{ inputs.tag }}
          BODY: ${{ inputs.body }}
        with:
          script: |
            const tag = process.env.TAG;
            const isPrerelease = tag.includes("-");
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              body: process.env.BODY,
              prerelease: isPrerelease,
              make_latest: isPrerelease ? "false" : "true",
            });
            core.info(`Updated release ${tag} (prerelease=${isPrerelease})`);
